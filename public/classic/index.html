<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pole Position (Classic 2D)</title>
<meta name="description" content="Classic pseudo-3D sprite-scaling version of the browser Pole Position remake.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Cpath fill='%23000' d='M0 0h4v4H0zM8 0h4v4H8zM4 4h4v4H4zM12 4h4v4h-4zM0 8h4v4H0zM8 8h4v4H8zM4 12h4v4H4zM12 12h4v4h-4z'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #101010; color: #ccc;
    font-family: monospace;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    outline: none;
  }
  #help {
    font-size: 12px; color: #888; text-align: center;
    line-height: 1.5;
  }
  #help b { color: #ddd; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="256" height="224" tabindex="0"></canvas>
  <div id="help">
    <b>&larr;/&rarr;</b> steer &nbsp; <b>&uarr;</b> accelerate &nbsp; <b>&darr;</b>/<b>Space</b> brake &nbsp;
    <b>Z</b>/<b>Shift</b> shift gear (LO/HI) &nbsp; <b>Enter</b> start &nbsp; <b>P</b> pause &nbsp; <b>M</b> mute
    &nbsp;&middot;&nbsp; <a href="/" style="color:#6bf">3D version</a>
  </div>
</div>
<script src="game.js"></script>
<script src="/touch.js"></script>
</body>
</html>
