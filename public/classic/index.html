<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pole Position</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #101010; color: #ccc;
    font-family: monospace;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    outline: none;
  }
  #help {
    font-size: 12px; color: #888; text-align: center;
    line-height: 1.5;
  }
  #help b { color: #ddd; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="256" height="224" tabindex="0"></canvas>
  <div id="help">
    <b>&larr;/&rarr;</b> steer &nbsp; <b>&uarr;</b> accelerate &nbsp; <b>&darr;</b> brake &nbsp;
    <b>Z</b>/<b>Shift</b> shift gear (LO/HI) &nbsp; <b>Enter</b> start &nbsp; <b>M</b> mute
    &nbsp;&middot;&nbsp; <a href="/" style="color:#6bf">3D version</a>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
