<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pole Position 3D</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #101010; color: #ccc;
    font-family: monospace;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
  }
  #stack { position: relative; }
  #stack canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #gl { background: #000; }
  #hud {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #help {
    font-size: 12px; color: #888; text-align: center;
    line-height: 1.5;
  }
  #help b { color: #ddd; }
  #help a { color: #6bf; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stack">
    <canvas id="gl" width="512" height="448"></canvas>
    <canvas id="hud" width="256" height="224"></canvas>
  </div>
  <div id="help">
    <b>&larr;/&rarr;</b> steer &nbsp; <b>&uarr;</b> accelerate &nbsp; <b>&darr;</b>/<b>Space</b> brake &nbsp;
    <b>Z</b>/<b>Shift</b> shift gear (LO/HI) &nbsp; <b>Enter</b> start &nbsp; <b>P</b> pause &nbsp; <b>M</b> mute
    &nbsp;&middot;&nbsp; <a href="/classic/">classic 2D version</a>
  </div>
</div>
<script type="module" src="game3d.js"></script>
<script src="/touch.js"></script>
</body>
</html>
